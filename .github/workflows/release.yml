# Релизы по тегу vX.Y.Z: сервер (linux) + десктоп-клиент под три системы.
#
# На выходе ровно три файла для людей:
#   mess-macos.dmg          — универсальный (Apple Silicon + Intel), перетащить в Applications
#   mess-windows-amd64.zip  — exe рядом с нужными dll
#   mess-linux-amd64.tar.gz — бинарь + ярлык + install.sh
# и отдельно бинари сервера для деплоя.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26.x" }
      - name: build
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o mess-server-linux-amd64 ./cmd/backmess
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o mess-server-linux-arm64 ./cmd/backmess
      - uses: softprops/action-gh-release@v2
        with:
          files: mess-server-linux-*

  # macOS собираем ТОЛЬКО на Apple Silicon и делаем universal-бинарь через lipo.
  # Отдельный Intel-раннер (macos-13) не используем: их мало, задача часами
  # висит в очереди, а результат тот же.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26.x" }
      - name: package
        run: ./scripts/package-macos.sh "${GITHUB_REF_NAME#v}" mess-macos.dmg
      - uses: softprops/action-gh-release@v2
        with:
          files: mess-macos.dmg

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26.x" }
      # Набор взят из CI самой Fyne. Ключевой тут libwayland-dev: Fyne 2.8 без
      # тега x11 собирает wayland-путь и требует wayland-client через
      # pkg-config — именно из-за него падала сборка в v0.1.0.
      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libwayland-dev libx11-dev libxkbcommon-dev xorg-dev \
            libopus-dev pkg-config
      - name: package
        run: ./scripts/package-linux.sh "${GITHUB_REF_NAME#v}" mess-linux-amd64.tar.gz
      - uses: softprops/action-gh-release@v2
        with:
          files: mess-linux-amd64.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26.x" }
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-opus mingw-w64-x86_64-pkg-config zip
      # -H windowsgui — чтобы при запуске не открывалось чёрное окно консоли.
      # Рядом с exe кладём dll из MinGW: без них приложение не стартует.
      - name: package
        shell: msys2 {0}
        run: |
          export PATH="$PATH:/c/hostedtoolcache/windows/go/$(ls /c/hostedtoolcache/windows/go | head -1)/x64/bin"
          CGO_ENABLED=1 go build -tags nolibopusfile -ldflags="-s -w -H windowsgui" -o mess.exe ./cmd/backmess-app
          mkdir dist && cp mess.exe dist/
          for dll in libopus-0.dll libwinpthread-1.dll libgcc_s_seh-1.dll; do
            cp /mingw64/bin/$dll dist/ 2>/dev/null || true
          done
          cd dist && zip -r ../mess-windows-amd64.zip .
      - uses: softprops/action-gh-release@v2
        with:
          files: mess-windows-amd64.zip
